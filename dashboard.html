<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - LXH Cloud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 250px; background: #141417; border-right: 1px solid #333; padding: 20px; }
        .sidebar h2 { color: #58a6ff; margin-bottom: 20px; }
        .nav-item { padding: 12px; border-radius: 6px; color: #aaa; }
        .nav-item.active { background: #2a2a2e; color: #fff; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .upload-area { 
            border: 2px dashed #444; padding: 30px; text-align: center; 
            border-radius: 12px; cursor: pointer; margin-bottom: 20px; transition: 0.2s;
        }
        .upload-area:hover { border-color: #58a6ff; background: rgba(88,166,255,0.05); }
        
        .progress-bar { width: 100%; height: 6px; background: #333; margin-top: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: #58a6ff; width: 0%; transition: width 0.1s; }
        
        /* CSS MediaFire Style */
        .file-list { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
        .file-card { 
            background: #141417; border: 1px solid #2a2a2e; border-radius: 8px; 
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-icon { font-size: 30px; color: #58a6ff; }
        .file-name { font-weight: bold; font-size: 16px; word-break: break-all; }
        .file-meta { font-size: 12px; color: #888; margin-top: 4px; }
        
        .action-btns { display: flex; gap: 10px; }
        .btn-download { background: #238636; color: #fff; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-copy { background: #1f6feb; color: #fff; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-delete { background: #da3633; color: #fff; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <canvas id="glitterCanvas" style="position:fixed; z-index:-1; pointer-events:none;"></canvas>
    <div class="dashboard">
        <div class="sidebar">
            <h2>LXH CLOUD</h2>
            <div class="nav-item active">📁 Server Của Bạn</div>
        </div>
        <div class="main-content">
            <h2>Tải File Lên</h2>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>Bấm vào đây để chọn file</p>
                <input type="file" id="fileInput" style="display: none;" multiple>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="uploadProgress"></div></div>
            <div class="file-list" id="fileList"></div>
        </div>
    </div>
    <div id="toast" class="toast">Đã copy link!</div>
    
    <script type="module" src="dashboard.js"></script>
</body>
      </html>

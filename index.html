<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- ============================================================
    SECTION: METADATA & CHARACTER ENCODING
    ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Luu Van Huy</title>

    <!-- ============================================================
    SECTION: GLOBAL STYLES & THEME VARIABLES
    ============================================================ -->
    <style>
        /* --------------------------------------------
           SUBSECTION: CSS CUSTOM PROPERTIES (THEME)
           -------------------------------------------- */
        :root {
            /* Color Palette - Primary Hues */
            --color-pink-primary: #ff6b9d;
            --color-pink-secondary: #ff8aae;
            --color-pink-tertiary: #ffb7c5;
            --color-pink-glow: rgba(255, 107, 157, 0.15);

            /* Neutral & Background */
            --color-bg-dark: #1a0a12;
            --color-bg-mid: #2a0a1e;
            --color-bg-light: #0a0a1a;
            --color-text-light: #fff;
            --color-text-muted: #d0b0c0;
            --color-text-dim: #6a5a6a;

            /* Spacing & Sizing */
            --radius-card: 44px;
            --radius-sm: 18px;
            --radius-xs: 12px;
            --padding-card: 48px 32px 42px;
            --transition-smooth: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

            /* Z-Index Stacking */
            --z-background: 0;
            --z-sakura: 1;
            --z-card: 2;
            --z-overlay: 10;
        }

        /* --------------------------------------------
           SUBSECTION: RESET & BASE
           -------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 50%, var(--color-bg-dark), var(--color-bg-mid), var(--color-bg-light));
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           SECTION: SAKURA RAIN ANIMATION LAYER
           ============================================================ */
        .sakura-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: var(--z-sakura);
            overflow: hidden;
        }

        .sakura {
            position: absolute;
            top: -30px;
            color: var(--color-pink-tertiary);
            font-size: 24px;
            opacity: 0.8;
            animation: fall linear infinite;
            text-shadow: 0 0 12px rgba(255, 150, 200, 0.4);
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-30px) rotate(0deg) scale(0.8);
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1.2);
                opacity: 0.1;
            }
        }

        /* ============================================================
           SECTION: MAIN CARD COMPONENT
           ============================================================ */
        .card {
            position: relative;
            z-index: var(--z-card);
            max-width: 640px;
            width: 100%;
            background: rgba(30, 12, 24, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-card);
            padding: var(--padding-card);
            margin-top: 20px;
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 0 30px 80px rgba(255, 100, 150, 0.06);
            transition: transform var(--transition-smooth), box-shadow 0.4s ease;
            overflow: hidden;
        }

        /* --------------------------------------------
           SUBSECTION: CARD BORDER EFFECTS (GLOWING PINK)
           -------------------------------------------- */

        /* Primary Border - Animated Gradient Shimmer */
        .card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--radius-card) + 2px);
            padding: 3px;
            background: linear-gradient(135deg,
                    var(--color-pink-primary),
                    var(--color-pink-secondary),
                    var(--color-pink-tertiary),
                    var(--color-pink-secondary),
                    var(--color-pink-primary),
                    #ff4d8a,
                    var(--color-pink-secondary),
                    var(--color-pink-tertiary),
                    var(--color-pink-primary));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: shimmerBorder 3s ease-in-out infinite;
        }

        /* Secondary Border - Inner Glow */
        .card::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: calc(var(--radius-card) - 4px);
            border: 1px solid transparent;
            background: linear-gradient(135deg,
                    rgba(255, 107, 157, 0.15),
                    rgba(255, 183, 197, 0.05),
                    rgba(255, 107, 157, 0.15));
            background-clip: padding-box;
            pointer-events: none;
            animation: innerGlow 4s ease-in-out infinite;
        }

        /* Card Hover State */
        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 40px 100px rgba(255, 100, 180, 0.10);
        }

        /* ============================================================
           SECTION: KEYFRAME ANIMATIONS
           ============================================================ */
        @keyframes shimmerBorder {
            0% {
                background-position: 0% 50%;
                opacity: 0.7;
            }
            50% {
                background-position: 100% 50%;
                opacity: 1;
            }
            100% {
                background-position: 0% 50%;
                opacity: 0.7;
            }
        }

        @keyframes innerGlow {
            0%,
            100% {
                opacity: 0.4;
                border-color: rgba(255, 107, 157, 0.1);
            }
            50% {
                opacity: 0.8;
                border-color: rgba(255, 183, 197, 0.25);
            }
        }

        /* ============================================================
           SECTION: HEADER COMPONENT
           ============================================================ */
        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg,
                    var(--color-pink-tertiary),
                    var(--color-pink-secondary),
                    var(--color-pink-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }

        /* Decorative Underline for Title */
        .header h1::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 157, 0.3), transparent);
            border-radius: 99px;
            animation: shimmerBorder 2.5s ease-in-out infinite;
        }

        .header p {
            color: var(--color-text-muted);
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 3px;
            font-weight: 300;
            opacity: 0.75;
        }

        /* ============================================================
           SECTION: DATETIME DISPLAY
           ============================================================ */
        .datetime {
            text-align: center;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 180, 210, 0.06);
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .datetime:hover {
            border-color: rgba(255, 107, 157, 0.3);
            box-shadow: 0 0 30px var(--color-pink-glow), inset 0 0 30px rgba(255, 107, 157, 0.03);
        }

        /* DateTime Border Glow */
        .datetime::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 23px;
            padding: 1px;
            background: linear-gradient(135deg, transparent, rgba(255, 107, 157, 0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: innerGlow 3s ease-in-out infinite;
        }

        .datetime .time {
            font-size: 30px;
            font-weight: 700;
            color: var(--color-text-light);
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255, 150, 200, 0.06);
        }

        .datetime .date {
            font-size: 14px;
            color: var(--color-text-muted);
            margin-top: 2px;
            letter-spacing: 1.5px;
        }

        /* ============================================================
           SECTION: MUSIC PLAYER CONTROLS
           ============================================================ */
        .music-section {
            text-align: center;
            padding: 16px 0 10px;
        }

        .song-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--color-pink-tertiary);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 5px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.06);
            position: relative;
            cursor: pointer;
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 7px;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--color-pink-secondary), var(--color-pink-tertiary));
            box-shadow: 0 0 20px rgba(255, 100, 180, 0.15);
            transition: width 0.1s linear;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #9a7a8a;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* Control Buttons */
        .music-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 14px;
        }

        .music-btn {
            padding: 8px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 180, 210, 0.15);
            background: rgba(255, 180, 210, 0.04);
            color: var(--color-pink-tertiary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.4s ease;
            letter-spacing: 0.5px;
            min-width: 100px;
            position: relative;
        }

        .music-btn:hover {
            background: rgba(255, 180, 210, 0.08);
            border-color: rgba(255, 107, 157, 0.35);
            box-shadow: 0 0 30px var(--color-pink-glow);
            transform: scale(1.02);
        }

        .music-btn:active {
            transform: scale(0.96);
        }

        /* ============================================================
           SECTION: SOCIAL LINKS
           ============================================================ */
        .social {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .social a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: #e0d0e8;
            position: relative;
        }

        .social a:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 107, 157, 0.25);
            box-shadow: 0 8px 30px rgba(255, 100, 180, 0.08), 0 0 40px var(--color-pink-glow);
        }

        /* Social Link Border Glow on Hover */
        .social a::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: calc(var(--radius-sm) + 1px);
            padding: 1px;
            background: linear-gradient(135deg, transparent, rgba(255, 107, 157, 0.05), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social a:hover::after {
            opacity: 1;
            animation: shimmerBorder 2s ease-in-out infinite;
        }

        .social a .icon {
            font-size: 22px;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
        }

        .social a .text {
            flex: 1;
        }

        .social a .arrow {
            color: #7a6a8a;
            font-size: 16px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .social a:hover .arrow {
            transform: translateX(6px);
            color: var(--color-pink-tertiary);
        }

        /* ============================================================
           SECTION: FOOTER
           ============================================================ */
        .footer {
            text-align: center;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 157, 0.15), transparent);
            border-radius: 99px;
            animation: shimmerBorder 3s ease-in-out infinite;
        }

        .footer p {
            font-size: 12px;
            color: var(--color-text-dim);
            letter-spacing: 1px;
        }

        .footer span {
            color: var(--color-pink-secondary);
        }

        /* ============================================================
           SECTION: YOUTUBE PLAYER (HIDDEN)
           ============================================================ */
        .video-wrapper {
            height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            border: none;
        }

        .video-wrapper iframe {
            display: none;
        }

        /* ============================================================
           SECTION: RESPONSIVE DESIGN (MOBILE FIRST)
           ============================================================ */
        @media (max-width: 480px) {
            :root {
                --radius-card: 32px;
                --padding-card: 28px 18px 24px;
            }

            .card::after {
                border-radius: calc(var(--radius-card) - 4px);
            }

            .header h1 {
                font-size: 26px;
            }

            .datetime .time {
                font-size: 24px;
            }

            .social a {
                padding: 12px 16px;
                font-size: 14px;
            }

            .social a .icon {
                font-size: 18px;
                width: 30px;
            }

            .music-btn {
                padding: 6px 16px;
                font-size: 13px;
                min-width: 80px;
            }
        }
    </style>
</head>

<body>
    <!-- ============================================================
    SECTION: SAKURA RAIN CONTAINER
    ============================================================ -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- ============================================================
    SECTION: MAIN CARD
    ============================================================ -->
    <div class="card">

        <!-- SUBSECTION: Header -->
        <header class="header">
            <h1>Welcome</h1>
            <p>Luu Van Huy</p>
        </header>

        <!-- SUBSECTION: Date & Time -->
        <section class="datetime">
            <div class="time" id="timeDisplay">00:00:00</div>
            <div class="date" id="dateDisplay">Thứ Hai, 01/09/2026</div>
        </section>

        <!-- SUBSECTION: Music Player -->
        <section class="music-section">
            <div class="song-title">ANH NHỚ EM - Tuấn Hưng</div>
            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="music-controls">
                <button class="music-btn" id="playBtn">▶ Phát</button>
                <button class="music-btn" id="pauseBtn">⏸ Tạm dừng</button>
            </div>
        </section>

        <!-- SUBSECTION: Social Links -->
        <section class="social">
            <a href="https://www.facebook.com/share/14qWrpe6AD9/" target="_blank" rel="noopener noreferrer">
                <span class="icon"></span>
                <span class="text">Facebook</span>
                <span class="arrow">→</span>
            </a>
            <a href="https://zalo.me/0876008142" target="_blank" rel="noopener noreferrer">
                <span class="icon">💬</span>
                <span class="text">Zalo</span>
                <span class="arrow">→</span>
            </a>
            <a href="https://discord.com/users/luuvan_h" target="_blank" rel="noopener noreferrer">
                <span class="icon"></span>
                <span class="text">Discord</span>
                <span class="arrow">→</span>
            </a>
        </section>

        <!-- SUBSECTION: Footer -->
        <footer class="footer">
            <p>Made with <span>❤</span> by <span>Luu Van Huy</span></p>
        </footer>

    </div>

    <!-- ============================================================
    SECTION: YOUTUBE PLAYER (BACKGROUND AUDIO)
    ============================================================ -->
    <div class="video-wrapper">
        <iframe id="youtubePlayer"
        src="https://www.youtube.com/embed/lyH7bbtBpIA?enablejsapi=1&autoplay=1"
        allow="autoplay; encrypted-media">
    </iframe>
</div>

<!-- ============================================================
SECTION: JAVASCRIPT APPLICATION LOGIC
============================================================ -->
<script>
    /**
     * ============================================================
     * MODULE: SAKURA RAIN GENERATOR
     * Description: Creates floating sakura petals with random
     *              positions, sizes, and animation speeds.
     * ============================================================
     */
    (function createSakuraRain() {
        const container = document.getElementById('sakuraContainer');
        const petalSymbols = ['🌸', '🌸', '🌸', '💮', '🌸', '🌸'];
        const PETAL_COUNT = 35;

        for (let i = 0; i < PETAL_COUNT; i++) {
            const petal = document.createElement('div');
            petal.className = 'sakura';
            petal.textContent = petalSymbols[Math.floor(Math.random() * petalSymbols.length)];
            petal.style.left = Math.random() * 100 + '%';
            petal.style.fontSize = (14 + Math.random() * 22) + 'px';
            petal.style.animationDuration = (8 + Math.random() * 16) + 's';
            petal.style.animationDelay = (Math.random() * 15) + 's';
            petal.style.opacity = 0.3 + Math.random() * 0.6;
            container.appendChild(petal);
        }
    })();

    /**
     * ============================================================
     * MODULE: REAL-TIME CLOCK
     * Description: Updates the time and date display every second.
     * ============================================================
     */
    (function initClock() {
        const timeElement = document.getElementById('timeDisplay');
        const dateElement = document.getElementById('dateDisplay');
        const DAY_NAMES = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            timeElement.textContent = `${hours}:${minutes}:${seconds}`;

            const day = DAY_NAMES[now.getDay()];
            const date = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            dateElement.textContent = `${day}, ${date}/${month}/${year}`;
        }

        updateClock();
        setInterval(updateClock, 1000);
    })();

    /**
     * ============================================================
     * MODULE: YOUTUBE IFRAME PLAYER CONTROLLER
     * Description: Manages the embedded YouTube player for audio.
     *              Handles play, pause, progress tracking, and
     *              error recovery.
     * ============================================================
     */
    (function initYouTubePlayer() {
        // ---- Private Variables ----
        let player = null;
        let isPlayerReady = false;
        let playAttempts = 0;
        const MAX_RETRY_ATTEMPTS = 5;

        // ---- DOM References ----
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');

        // ---- Utility Functions ----
        function formatTime(seconds) {
            if (!seconds || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgressDisplay() {
            if (!player || !player.getCurrentTime) return;
            const current = player.getCurrentTime();
            const duration = player.getDuration();

            if (duration > 0) {
                const percent = (current / duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(current);
                totalTimeEl.textContent = formatTime(duration);
            }
        }

        // ---- YouTube API Event Handlers ----
        function onPlayerReady(event) {
            isPlayerReady = true;
            const duration = player.getDuration();
            totalTimeEl.textContent = formatTime(duration);
            setInterval(updateProgressDisplay, 500);
            player.playVideo();
        }

        function onPlayerStateChange(event) {
            const state = event.data;
            if (state === YT.PlayerState.PLAYING) {
                playBtn.textContent = '▶ Tiếp tục';
            } else if (state === YT.PlayerState.PAUSED) {
                playBtn.textContent = '▶ Phát';
            } else if (state === YT.PlayerState.ENDED) {
                playBtn.textContent = '▶ Phát lại';
            }
        }

        function onPlayerError(event) {
            console.warn('[YouTube] Error code:', event.data);
            if (playAttempts < MAX_RETRY_ATTEMPTS) {
                playAttempts++;
                setTimeout(() => {
                    if (player && isPlayerReady) {
                        player.playVideo();
                    }
                }, 2000);
            }
        }

        // ---- Player Initialization ----
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtubePlayer', {
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError
                }
            });
        };

        // ---- DOM Event Bindings ----
        // Progress Bar Click (Seek)
        progressBar.addEventListener('click', function(e) {
            if (!player || !player.getDuration) return;
            const rect = this.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            player.seekTo(clickX * duration, true);
        });

        // Play Button
        playBtn.addEventListener('click', function() {
            if (!isPlayerReady) {
                alert(' Đang tải nhạc, vui lòng chờ...');
                return;
            }
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PAUSED ||
                state === YT.PlayerState.ENDED ||
                state === -1) {
                player.playVideo();
            } else if (state !== YT.PlayerState.PLAYING) {
                player.playVideo();
            }
        });

        // Pause Button
        pauseBtn.addEventListener('click', function() {
            if (!isPlayerReady) {
                alert(' Đang tải nhạc, vui lòng chờ...');
                return;
            }
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            }
        });

        // ---- Load YouTube IFrame API ----
        const scriptTag = document.createElement('script');
        scriptTag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(scriptTag);

        // ---- Fallback: Retry autoplay after 3s ----
        setTimeout(() => {
            if (isPlayerReady) {
                try { player.playVideo(); } catch (_) { /* ignore */ }
            }
        }, 3000);
    })();
</script>

</body>
</html>
